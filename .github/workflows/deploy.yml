name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only the deploy job below is granted pages/id-token.
permissions:
  contents: read

# Let one deploy finish before the next starts; don't cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run build
        env:
          # Repository variable, not a secret: the Cloudflare site token is
          # public by design. Unset simply means no beacon in the output.
          PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}

      # Assertions about dist/ that a type-check cannot make: nothing hidden
      # leaked into a published page, every table is in its scroll container,
      # the analytics beacon is host-guarded, links and fragments resolve.
      - run: npm run verify

      # The same assertions against content built to break them, plus the dev
      # half of the rule. See scripts/test-visibility.mjs.
      - run: npm test

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
