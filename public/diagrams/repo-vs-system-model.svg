<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img"
     aria-label="Two stacked layers: a system model layer above a repository layer.">
  <!-- Mid-tone neutrals only, so the diagram reads on both light and dark backgrounds. -->
  <g fill="none" stroke="#8a8781" stroke-width="1.25">
    <rect x="40" y="24" width="560" height="96" rx="3"/>
    <rect x="40" y="160" width="560" height="96" rx="3"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#8a8781">
    <text x="60" y="52" font-size="11" letter-spacing="1.2">SYSTEM MODEL</text>
    <text x="60" y="78" font-size="14">boundaries · invariants · ownership · intent</text>
    <text x="60" y="100" font-size="13" font-style="italic">mostly not written down</text>

    <text x="60" y="188" font-size="11" letter-spacing="1.2">REPOSITORY</text>
    <text x="60" y="214" font-size="14">files · modules · call graph · history</text>
    <text x="60" y="236" font-size="13" font-style="italic">what an agent can read today</text>
  </g>
  <g stroke="#8a8781" stroke-width="1.25" fill="none">
    <path d="M320 160 L320 128"/>
    <path d="M314 134 L320 126 L326 134"/>
  </g>
</svg>
